[package]
name = "oclivenewnew-tauri"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0"
description = "oclive desktop companion — Tauri + Vue + Rust dialogue engine"

[features]
default = [
  "tauri-app",
  "custom-protocol",
  "invoke-full",
]
tauri-app = ["dep:tauri", "dep:tauri-plugin-deep-link", "dep:tauri-build"]
custom-protocol = ["tauri/custom-protocol"]
# Optional Tauri `invoke` command groups (see `src/invoke_registry.rs` + `src/gen/tauri-invoke-capabilities.ts`).
invoke-full = [
  "invoke-agent",
  "invoke-expert-models",
  "invoke-role-market",
  "invoke-plugin-market",
  "invoke-plugin-creator",
]
invoke-agent = []
invoke-expert-models = []
invoke-role-market = []
invoke-plugin-market = []
invoke-plugin-creator = []

[dependencies]
oclive_validation = { path = "../crates/oclive_validation" }
oclive_core = { path = "../crates/oclive_core" }
oclive_kernel_runtime = { path = "../crates/oclive_kernel_runtime" }
tauri = { version = "1.5", optional = true, features = [ "protocol-asset", "shell-open", "dialog-open", "dialog-save", "fs-write-file", "fs-read-file", "global-shortcut"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { workspace = true }
async-trait = "0.1"
parking_lot = "0.12"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
once_cell = "1.0"
tempfile = "3.8"
toml = "0.8"
semver = "1.0"
notify = "6"
tauri-plugin-deep-link = { version = "0.1.2", optional = true }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
reqwest = { workspace = true }

[dev-dependencies]
axum = { version = "0.7" }
tower = { version = "0.4", features = ["util"] }
sqlx = { version = "0.7", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlite", "migrate"] }

[build-dependencies]
tauri-build = { version = "1.5", features = [], optional = true }
