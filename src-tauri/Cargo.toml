[package]
name = "oclivenewnew-tauri"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "oclive desktop companion ? Tauri + Vue + Rust dialogue engine"
repository = "https://github.com/linkaiheng2233-cyber/oclivenewnew"
keywords = ["oclive", "tauri", "companion", "llm", "sqlite"]
categories = ["gui"]

[lints]
workspace = true

# Avoid `cargo test --workspace` doc-test races (E0460: stale `oclive_validation` rlib) on Windows
# when multiple workspace members rebuild the same path dependency in parallel.
[lib]
doctest = false

[features]
default = ["custom-protocol", "desktop"]
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri-plugin-deep-link"]
headless = []
dual_core = []

[dependencies]
oclive_validation = { path = "../crates/oclive_validation" }
oclive_kernel_runtime = { path = "../crates/oclive_kernel_runtime" }
tauri = { version = "1.5", features = [ "protocol-asset", "shell-open", "dialog-open", "dialog-save", "global-shortcut"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync", "net"] }
arc-swap = "1.7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dashmap = "6"
tracing-appender = "0.2"
once_cell = "1.0"
tempfile = "3.8"
toml = "0.8"
walkdir = "2.5"
semver = "1.0"
notify = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
sha2 = "0.10"
indexmap = "2"
tauri-plugin-deep-link = { version = "0.1.2", optional = true }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
