[package]
name = "oclivenewnew-tauri"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0"
description = "oclive desktop companion — Tauri + Vue + Rust dialogue engine"

[features]
default = ["tauri-app", "custom-protocol"]
tauri-app = ["dep:tauri", "dep:tauri-plugin-deep-link", "dep:tauri-build"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
oclive_validation = { path = "../crates/oclive_validation" }
oclive_core = { path = "../crates/oclive_core" }
oclive_kernel_runtime = { path = "../crates/oclive_kernel_runtime" }
tauri = { version = "1.5", optional = true, features = [ "protocol-asset", "shell-open", "dialog-open", "dialog-save", "fs-write-file", "fs-read-file", "global-shortcut"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.11", features = ["json", "blocking"] }
once_cell = "1.0"
tempfile = "3.8"
toml = "0.8"
walkdir = "2.5"
semver = "1.0"
notify = "6"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
sha2 = "0.11.0"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["std"] }
tauri-plugin-deep-link = { version = "0.1.2", optional = true }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

[build-dependencies]
tauri-build = { version = "1.5", features = [], optional = true }
