# Rust 构建产物（target）移出仓库根目录，与「源码 + 配置」分离：
# - 看磁盘时：本仓库文件夹更接近「实际需要备份/同步」的体积
# - 用户安装的软件仍只含发布包，不包含本目录
#
# 产物路径：与仓库同级目录 ../oclive-dev-artifacts/oclivenewnew-cargo-target/
# 缓存新旧或路径变化不是删除许可；维护前按 CONTRIBUTING 与 K-BUILD-07 核消费者、冻结引用和重建预算。
[build]
target-dir = "../oclive-dev-artifacts/oclivenewnew-cargo-target"
