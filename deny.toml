# Workspace policy for `oclive lint --deny` / `cargo deny check`.
# Tighten allow-list when auditing for release.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "NCSA",
]
confidence-threshold = 0.8

[bans]
# K-SUPPLY-05: raise to "deny" after `cargo tree -d` duplicate cleanup (ratchet: scripts/check-cargo-dedup-ratchet.mjs).
multiple-versions = "warn"
