[workspace]
members = [
  "crates/oclive_core",
  "crates/oclive_validation",
  "crates/oclive_kernel_runtime",
  "crates/oclive_kernel_server",
  "examples/kernel_embed_minimal",
  "src-tauri",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
reqwest = { version = "0.11", default-features = false, features = [
  "default-tls",
  "gzip",
  "json",
] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
