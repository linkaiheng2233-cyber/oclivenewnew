[workspace]
members = [
  "crates/oclive_core",
  "crates/oclive_validation",
  "crates/oclive_kernel_core",
  "crates/oclive_kernel_models",
  "crates/oclive_memory_builtin",
  "crates/oclive_emotion_builtin",
  "crates/oclive_complex_emotion_builtin",
  "crates/oclive_agent_builtin",
  "crates/oclive_prompt_builtin",
  "crates/oclive_event_builtin",
  "crates/oclive_kernel_runtime",
  "crates/oclive_kernel_server",
  "examples/kernel_embed_minimal",
  "src-tauri",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "process", "io-util", "fs"] }
reqwest = { version = "0.11", default-features = false, features = [
  "default-tls",
  "gzip",
  "json",
] }

[profile.release]
opt-level = "z"
# Thin LTO balances binary size vs compile/link time (CI + local release). Fat `lto = true` trims a few
# percent more at the cost of much longer builds; keep thin unless a release pipeline explicitly budgets for fat LTO.
lto = "thin"
codegen-units = 1
# Strip debuginfo from release artifacts to shrink disk size while retaining symbol names for backtraces.
strip = "debuginfo"
