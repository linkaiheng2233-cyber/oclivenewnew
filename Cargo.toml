[workspace]
members = [
    "crates/oclive_validation",
    "crates/oclive_validation_wasm",
    "crates/oclive_schema",
    "crates/oclive_kernel_types",
    "crates/oclive_kernel_contracts",
    "crates/oclive_kernel_runtime",
    "crates/oclive_kernel_host",
    "crates/oclive_kernel_server",
    "crates/oclive-cli",
    "crates/oclive_sqlx",
    "src-tauri",
    "fuzz",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync", "net", "signal"] }
sqlx = { path = "crates/oclive_sqlx", package = "oclive_sqlx" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
once_cell = "1.0"
tempfile = "3.8"
toml = "0.8"
walkdir = "2.5"
semver = "1.0"
notify = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
sha2 = "0.10"
indexmap = "2"
arc-swap = "1.7"
dashmap = "6"
tracing-appender = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
return_self_not_must_use = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
await_holding_lock = "deny"
large_enum_variant = "warn"
result_large_err = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release.package."*"]
codegen-units = 16

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
