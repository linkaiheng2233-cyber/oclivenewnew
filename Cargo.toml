[workspace]
members = [
    "kernel/crates/oclive_validation",
    "kernel/crates/oclive_validation_wasm",
    "kernel/crates/oclive_schema",
    "kernel/crates/oclive_ci_plan",
    "kernel/crates/oclive_scaffold",
    "kernel/crates/oclive_kernel_types",
    "kernel/crates/oclive_kernel_contracts",
    "kernel/crates/oclive_kernel_runtime",
    "kernel/crates/oclive_kernel_host",
    "kernel/crates/oclive_kernel_server",
    "kernel/crates/oclive-cli",
    "kernel/crates/oclive_sqlx",
    "distros/desktop-tauri",
    "kernel/fuzz",
]
resolver = "2"
default-members = [
    "kernel/crates/oclive_validation",
    "kernel/crates/oclive_validation_wasm",
    "kernel/crates/oclive_schema",
    "kernel/crates/oclive_ci_plan",
    "kernel/crates/oclive_scaffold",
    "kernel/crates/oclive_kernel_types",
    "kernel/crates/oclive_kernel_contracts",
    "kernel/crates/oclive_kernel_runtime",
    "kernel/crates/oclive_kernel_host",
    "kernel/crates/oclive_kernel_server",
    "kernel/crates/oclive-cli",
    "kernel/crates/oclive_sqlx",
    "distros/desktop-tauri",
]

[workspace.dependencies]
# Temporary local preparation; replace with an immutable remote revision before delivery.
oclive_kernel_base = { path = "E:/OCLive/oclive-kernel/crates/oclive_kernel_base" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync", "net", "signal"] }
sqlx = { path = "kernel/crates/oclive_sqlx", package = "oclive_sqlx" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
once_cell = "1.0"
tempfile = "3.8"
toml = "1"
walkdir = "2.5"
semver = "1.0"
notify = "6"
# 9.x 起 `deflate` 元特性会把 flate2 后端切到 zlib-rs，那会连带改掉 `png` 与
# `oclive-cli`（gzip 发布产物）的实际压缩实现；这里只取 flate2 后端，保持
# `rust_backend` 不变（我们从不设置压缩等级，因此不依赖 zopfli 那部分）。
# 注意：zip 的 `deflate-flate2` 只 `dep:flate2` 而**不选后端**，所以每个直接依赖
# zip 的 crate 都必须同时声明 `flate2`（本文件下一行）才能在单独构建时通过。
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# 暂不提 flate2 1.1.10（2026-10-18 核查）：1.1.10 的依赖集合改为
# `crc32fast + miniz_oxide 0.9 + zlib-rs`，会同时带来两个后果——
# ① 与 `png 0.17.16` 仍要求的 `miniz_oxide 0.8` 形成双版本，撞上 deny.toml
#    的 `multiple-versions = "deny"`；② 后端切到 zlib-rs，改掉 `oclive-cli`
#    gzip 发布产物的压缩实现。解除条件：`png`（经 tauri-codegen/ico）迁到
#    miniz_oxide 0.9，届时可一并升级并接受 zlib-rs 供应链。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
sha2 = "0.10"
indexmap = "2"
arc-swap = "1.7"
dashmap = "6"
tracing-appender = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
return_self_not_must_use = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
await_holding_lock = "deny"
large_enum_variant = "warn"
result_large_err = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release.package."*"]
codegen-units = 16

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
