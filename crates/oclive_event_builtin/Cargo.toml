[package]
name = "oclive_event_builtin"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Oclive built-in event detection, event-impact LLM pipeline, and EventEstimator shell (Kernel V2 phase 7)."
readme = "README.md"
keywords = ["oclive", "kernel", "event"]

[features]
default = ["providers"]
## `EventEstimator` Builtin / BuiltinV2；`EventImpactEngine` 由本 crate 的 [`event_impact_ai`](crate::event_impact_ai) 实现，经 runtime 薄桥接注册。
providers = []

[dependencies]
oclive_kernel_core = { path = "../oclive_kernel_core" }
oclive_kernel_models = { path = "../oclive_kernel_models" }
oclive_validation = { path = "../oclive_validation" }
async-trait = "0.1"
serde_json = "1.0"
log = "0.4"

[dev-dependencies]
tokio = { workspace = true }
