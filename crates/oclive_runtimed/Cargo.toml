[package]
name = "oclive_runtimed"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "OCLive kernel scheduler: health supervision + per-role HTTP queue"
repository = "https://github.com/linkaiheng2233-cyber/oclivenewnew"

[lints]
workspace = true

[[bin]]
name = "oclive-runtimed"
path = "src/main.rs"

[dependencies]
oclive_kernel_runtime = { path = "../oclive_kernel_runtime" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
dashmap = "6"
tower = { version = "0.4", features = ["util"] }
