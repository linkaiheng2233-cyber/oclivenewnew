[package]
name = "oclive_kernel_host"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Headless OCLive kernel HTTP host (tracing + API server; no Tauri window)"
repository = "https://github.com/linkaiheng2233-cyber/oclivenewnew"
keywords = ["oclive", "kernel", "headless", "http"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[lib]
doctest = false

[features]
default = []
dual_core = []
tauri-commands = ["dep:tauri"]

[dependencies]
tauri = { version = "1.5", optional = true, default-features = false }
oclive_validation = { path = "../oclive_validation" }
oclive_kernel_runtime = { path = "../oclive_kernel_runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync", "net"] }
arc-swap = "1.7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dashmap = "6"
tracing-appender = "0.2"
once_cell = "1.0"
tempfile = "3.8"
toml = "0.8"
walkdir = "2.5"
semver = "1.0"
notify = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
sha2 = "0.10"
indexmap = "2"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
