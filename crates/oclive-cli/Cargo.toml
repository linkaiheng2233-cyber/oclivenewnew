[package]
name = "oclive-cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Official oclive kernel project scaffolding CLI"
readme = "README.md"
repository = "https://github.com/linkaiheng2233-cyber/oclivenewnew"
keywords = ["oclive", "cli", "scaffold", "monolith", "kernel"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[[bin]]
name = "oclive-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
handlebars = "5.1"
notify = "6"
oclive_validation = { path = "../oclive_validation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
