[package]
name = "oclive-cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Official oclive kernel project scaffolding CLI"
readme = "README.md"

[[bin]]
name = "oclive-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
handlebars = "5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
