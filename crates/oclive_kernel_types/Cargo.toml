[package]
name = "oclive_kernel_types"
version = "0.2.0"
edition = "2021"
description = "Pure data structures for OCLIVE kernel (DTOs, errors, enums)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/linkaiheng2233-cyber/oclivenewnew"
keywords = ["oclive", "kernel", "types"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
oclive_validation = { path = "../oclive_validation" }
parking_lot = { workspace = true }
