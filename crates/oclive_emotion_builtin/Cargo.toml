[package]
name = "oclive_emotion_builtin"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Oclive built-in keyword 7D emotion analysis (Kernel V2 phase 5 facility crate)."
readme = "README.md"

[features]
default = ["classic"]
## 关键词七维算法；关闭时用强中性桩（显著减小二进制）。
classic = []
## `UserEmotionAnalyzer` Builtin / BuiltinV2；由 `oclive_kernel_runtime` 的 `default-emotion-providers` 开启。依赖 `classic`。
providers = ["classic"]

[dependencies]
oclive_kernel_core = { path = "../oclive_kernel_core" }
