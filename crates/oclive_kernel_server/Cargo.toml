[package]
name = "oclive_kernel_server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Oclive Kernel Server (standalone, no Tauri): OOCP WS/HTTP endpoint"

[dependencies]
oclive_core = { path = "../oclive_core" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"

