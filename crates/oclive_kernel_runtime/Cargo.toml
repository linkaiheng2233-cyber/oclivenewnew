[package]
name = "oclive_kernel_runtime"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "oclive dialogue kernel contracts and shared constants (headless / embedded)"
repository = "https://github.com/linkaiheng2233-cyber/oclivenewnew"
keywords = ["oclive", "kernel", "runtime", "companion"]
categories = ["development-tools"]

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
oclive_kernel_types = { path = "../oclive_kernel_types" }
parking_lot = { workspace = true }
oclive_kernel_contracts = { path = "../oclive_kernel_contracts" }
oclive_validation = { path = "../oclive_validation" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
async-trait = { workspace = true }
walkdir = { workspace = true }
tracing = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
