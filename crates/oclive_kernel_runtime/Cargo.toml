[package]
name = "oclive_kernel_runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Oclive kernel runtime (standalone): state, domain, infrastructure and OOCP bindings"

[features]
default = []
## Desktop 壳启用后，为 `AppError -> tauri::InvokeError` 提供实现（孤儿规则要求与 `AppError` 同 crate）。
tauri_invoke = ["dep:tauri"]

[dependencies]
oclive_core = { path = "../oclive_core" }
oclive_validation = { path = "../oclive_validation" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { workspace = true }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
reqwest = { workspace = true }
once_cell = "1.0"
tempfile = "3.8"
toml = "0.8"
walkdir = "2.5"
semver = "1.0"
notify = "6"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
sha2 = "0.11.0"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["std"] }
tauri = { version = "1.5", optional = true, default-features = false }

