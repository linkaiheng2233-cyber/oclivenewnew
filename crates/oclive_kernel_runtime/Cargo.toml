[package]
name = "oclive_kernel_runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Oclive kernel runtime (no tauri): state, domain, infrastructure and OOCP bindings"

[dependencies]
oclive_core = { path = "../oclive_core" }
oclive_validation = { path = "../oclive_validation" }
oclivenewnew-tauri = { path = "../../src-tauri", default-features = false }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.11", features = ["json", "blocking"] }
once_cell = "1.0"
tempfile = "3.8"
toml = "0.8"
walkdir = "2.5"
semver = "1.0"
notify = "6"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
sha2 = "0.11.0"

