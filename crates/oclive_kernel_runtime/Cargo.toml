[package]
name = "oclive_kernel_runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Oclive kernel runtime: portable domain, SQLite persistence, plugins, and optional Axum HTTP/OOCP WS."
readme = "README.md"
keywords = ["oclive", "kernel", "chat", "roleplay", "plugin"]

[[bin]]
name = "oclive_test_dir_plugin"
path = "src/bin/oclive_test_dir_plugin.rs"
test = false
bench = false

[features]
## 默认与官方桌面 / kernel_server 一致；嵌入式宿主可用 `default-features = false` 并按需开启子特性。
default = ["full"]
full = ["kernel-http-api", "role-pack-zip", "market-sync", "kernel-agent"]
## 本地 HTTP 试聊 + OOCP WebSocket（Axum）；关闭后可省去 axum/tower-http 编译。
kernel-http-api = ["dep:axum", "dep:tower-http"]
## `.oclive-plugin` / 角色包 ZIP（`zip` crate）；关闭后省略 ZIP 编解码栈。
role-pack-zip = ["dep:zip"]
## 角色 / 插件市场索引与评价索引 HTTP 同步模块。
market-sync = []
## MCP + Builtin ReAct Agent + 目录 Agent HTTP 侧车等路径。
kernel-agent = []
## Desktop 壳：`AppError -> tauri::InvokeError`（孤儿规则）。
tauri_invoke = ["dep:tauri"]

[dependencies]
oclive_core = { path = "../oclive_core" }
oclive_validation = { path = "../oclive_validation" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { workspace = true }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
reqwest = { workspace = true }
once_cell = "1.0"
tempfile = "3.8"
toml = "0.8"
walkdir = "2.5"
semver = "1.0"
zip = { version = "0.6", optional = true, default-features = false, features = ["deflate"] }
axum = { version = "0.7", optional = true, features = ["ws"] }
tower-http = { version = "0.5", optional = true, features = ["cors"] }
futures-util = "0.3"
sha2 = "0.11.0"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["std"] }
tauri = { version = "1.5", optional = true, default-features = false }

[dev-dependencies]
serde_json = "1.0"
async-trait = "0.1"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "kernel_hot_paths"
harness = false

[[bench]]
name = "kernel_plugins_persistence"
harness = false
required-features = ["full"]

