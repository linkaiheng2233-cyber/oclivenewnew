[package]
name = "oclive_kernel_runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Oclive kernel runtime: portable domain, SQLite persistence, plugins, and optional Axum HTTP/OOCP WS."
readme = "README.md"
keywords = ["oclive", "kernel", "chat", "roleplay", "plugin"]

[[bin]]
name = "oclive_test_dir_plugin"
path = "src/bin/oclive_test_dir_plugin.rs"
test = false
bench = false

[features]
## 默认与官方桌面 / kernel_server 一致；嵌入式宿主可用 `default-features = false` 并按需开启子特性。
default = ["full"]
full = [
  "kernel-http-api",
  "role-pack-zip",
  "market-sync",
  "kernel-agent",
  "facility-classic-algorithms",
  "default-llm-providers",
  "default-memory-providers",
  "default-emotion-providers",
  "default-event-providers",
  "default-prompt-providers",
  "default-complex-emotion-providers",
  "default-agent-providers",
]
## 设施 crate 的 `classic` 算法（记忆排序 / 情绪关键词 / 七维→效价）。`full` 默认开启；`--no-default-features` 时关闭以使用桩实现。
facility-classic-algorithms = [
  "oclive_memory_builtin/classic",
  "oclive_emotion_builtin/classic",
  "oclive_complex_emotion_builtin/classic",
]
## 内置 Ollama、OpenAI-compatible 云 LLM，以及 OCLIVE_REMOTE_LLM_URL JSON-RPC 侧车；关闭后须用 directory 目录插件等提供 LLM（侧车与内置客户端均不装配）。
default-llm-providers = []
## 进程内 Builtin/BuiltinV2 记忆提供者（`oclive_memory_builtin` 的 `providers`）；关闭后 trait 仍可用，builtin 槽与 Remote 占位回退为轻量桩。`providers` 隐含设施 crate 的 `classic`；亦可单独开 **`facility-classic-algorithms`** 以在无 Builtin 记忆时保留排序语义。
default-memory-providers = ["oclive_memory_builtin/providers"]
## 进程内 Builtin/BuiltinV2 用户句情绪分析（`oclive_emotion_builtin` 的 `providers`）；关闭后回退中性分布桩。`providers` 隐含 `classic`；关 **`facility-classic-algorithms`** 且未开 `providers` 时用关键词桩的「关」态（强中性，见设施 crate `classic/stub`）。
default-emotion-providers = ["oclive_emotion_builtin/providers"]
## 内置事件影响估计（event_impact_ai）；关闭后 builtin 槽与 Remote 占位回退为 Ignore 桩。
default-event-providers = ["dep:oclive_event_builtin", "oclive_event_builtin/providers"]
## 进程内 Builtin/BuiltinV2 Prompt 组装（`oclive_prompt_builtin` 的 `providers`）；关闭后 builtin 槽与 Remote 占位回退为空串桩。`providers` 隐含设施 crate 的 `classic`。
default-prompt-providers = ["oclive_prompt_builtin/providers"]
## 内置复杂情感关键词模式（`oclive_complex_emotion_builtin` 的 `providers`）；关闭后 builtin 槽与 Remote 降级回退为轻量桩。`providers` 隐含 `classic`；关 **`facility-classic-algorithms`** 时七维→效价函数为 `(0,0)` 桩。
default-complex-emotion-providers = ["oclive_complex_emotion_builtin/providers"]
## 进程内 `BuiltinReActAgent`（设施 crate `oclive_agent_builtin` 的 `providers`）；关闭后若仍开启 `kernel-agent`，仅装配 **McpShellAgent**（`process` 不执行 ReAct）。须与 **`kernel-agent`** 同开方可使用进程内 ReAct（MCP + LLM）。
default-agent-providers = ["dep:oclive_agent_builtin", "oclive_agent_builtin/providers"]
## 本地 HTTP 试聊 + OOCP WebSocket（Axum）；关闭后可省去 axum/tower-http 编译。
kernel-http-api = ["dep:axum", "dep:tower-http"]
## `.oclive-plugin` / 角色包 ZIP（`zip` crate）；关闭后省略 ZIP 编解码栈。
role-pack-zip = ["dep:zip"]
## 角色 / 插件市场索引与评价索引 HTTP 同步模块。
market-sync = []
## MCP 客户端 + 目录 Agent HTTP 侧车等；与 **`default-agent-providers`** 组合时装配进程内 **Builtin ReAct**。
kernel-agent = []

[dependencies]
oclive_agent_builtin = { path = "../oclive_agent_builtin", optional = true, default-features = false }
oclive_prompt_builtin = { path = "../oclive_prompt_builtin", default-features = false }
oclive_event_builtin = { path = "../oclive_event_builtin", optional = true, default-features = false }
oclive_memory_builtin = { path = "../oclive_memory_builtin", default-features = false }
oclive_emotion_builtin = { path = "../oclive_emotion_builtin", default-features = false }
oclive_complex_emotion_builtin = { path = "../oclive_complex_emotion_builtin", default-features = false }
oclive_kernel_core = { path = "../oclive_kernel_core" }
oclive_kernel_models = { path = "../oclive_kernel_models" }
oclive_core = { path = "../oclive_core" }
oclive_validation = { path = "../oclive_validation" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { workspace = true }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
reqwest = { workspace = true }
once_cell = "1.0"
tempfile = "3.8"
toml = "0.8"
walkdir = "2.5"
semver = "1.0"
zip = { version = "0.6", optional = true, default-features = false, features = ["deflate"] }
axum = { version = "0.7", optional = true, features = ["ws"] }
tower-http = { version = "0.5", optional = true, features = ["cors"] }
futures-util = "0.3"
sha2 = "0.11.0"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1.0"
async-trait = "0.1"
criterion = { version = "0.5", features = ["async_tokio"] }
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }

[[bench]]
name = "kernel_hot_paths"
harness = false

[[bench]]
name = "kernel_plugins_persistence"
harness = false
required-features = ["full"]

