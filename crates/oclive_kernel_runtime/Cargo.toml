[package]
name = "oclive_kernel_runtime"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "oclive dialogue kernel contracts and shared constants (headless / embedded)"
repository = "https://github.com/linkaiheng2233-cyber/oclivenewnew"
keywords = ["oclive", "kernel", "runtime", "companion"]
categories = ["development-tools"]

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
oclive_kernel_types = { path = "../oclive_kernel_types" }
oclive_kernel_contracts = { path = "../oclive_kernel_contracts" }
oclive_validation = { path = "../oclive_validation" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
walkdir = "2.5"
tracing = "0.1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
