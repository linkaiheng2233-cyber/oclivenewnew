[package]
name = "oclive_validation_wasm"
version = "0.1.0"
edition = "2021"
description = "WASM cdylib facade for oclive_validation (avoids native/wasm target competition)"
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
oclive_validation = { path = "../oclive_validation", features = ["wasm"] }
wasm-bindgen = "0.2"
