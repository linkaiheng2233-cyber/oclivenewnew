[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oclive-oocp-client"
version = "0.1.0"
description = "Minimal Python HTTP client for oclive_kernel_server / OOCP REST (/health, /chat)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [{ name = "Oclive contributors" }]
keywords = ["oclive", "oocp", "http", "client"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["oclive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
