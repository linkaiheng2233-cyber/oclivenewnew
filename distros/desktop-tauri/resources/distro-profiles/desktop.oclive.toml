# OCLive Chat Pro — bundled install profile (聊天基础发行版 · Pro · open ceiling)
# Omit [plugin_backends]: role blueprints + directory plugins retain full six-slot surface.
# See creator-docs/kernel/DISTRO_CAPABILITY_PROFILE.md · DISTRO_DEFAULT_PLUGINS.md §3.1

schema_version = 1
distro_id = "desktop"
display_name = "OCLive Chat Pro"

[interaction]
default_mode = "pure_chat"
allow_mode_switch = true
immersive_unlock_hint_after_turns = 10

[host_flags]
skip_agent = false
skip_complex_emotion = false

[slots]
complex_emotion = "on"

[prompt]
profile = "full"

[state_expression]
favor_high = "可更自然地分享日常与情绪，但仍遵守关系阶段"
favor_mid  = "保持温暖、有分寸的闲聊节奏"
favor_low  = "礼貌克制，勿过度主动"

[memory]
retrieval = "default"

[post_process]
chain = "standard"

[llm_runtime]
mode = "performance"
endpoint = "http://127.0.0.1:8421"
auto_start = true
startup_timeout_ms = 90000
retry_cooldown_ms = 30000
model_alias = "oclive-performance"

[turn_thinking]
default = "auto"
fast_skip_complex_emotion = true
auto_deep_min_chars = 80
fast_knowledge_limit = 4
fast_memory_cap = 4
fast_persistence = "strong_only"
prompt_prefix_cache = true
