[package]
name = "oclivenewnew-tauri"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "oclive desktop companion ? Tauri + Vue + Rust dialogue engine"
repository = "https://github.com/linkaiheng2233-cyber/oclivenewnew"
keywords = ["oclive", "tauri", "companion", "llm", "sqlite"]
categories = ["gui"]

[lints]
workspace = true

# Avoid `cargo test --workspace` doc-test races (E0460: stale `oclive_validation` rlib) on Windows
# when multiple workspace members rebuild the same path dependency in parallel.
[lib]
doctest = false

[features]
default = ["custom-protocol", "desktop"]
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri-plugin-deep-link"]
dual_core = ["oclive_kernel_host/dual_core"]

[dependencies]
oclive_kernel_host = { path = "../../kernel/crates/oclive_kernel_host", features = ["tauri-commands"] }
oclive_kernel_types = { path = "../../kernel/crates/oclive_kernel_types" }
oclive_validation = { path = "../../kernel/crates/oclive_validation" }
oclive_kernel_runtime = { path = "../../kernel/crates/oclive_kernel_runtime" }
tauri = { version = "1.5", features = [ "window-minimize", "window-unmaximize", "window-set-decorations", "window-close", "window-maximize", "window-start-dragging", "protocol-asset", "shell-open", "dialog-open", "dialog-save", "global-shortcut"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync", "net"] }
arc-swap = { workspace = true }
sqlx = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
parking_lot = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "std", "json"] }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
dashmap = { workspace = true }
tracing-appender = { workspace = true }
once_cell = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
semver = { workspace = true }
notify = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
axum = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
sha2 = { workspace = true }
indexmap = { workspace = true }
tauri-plugin-deep-link = { version = "0.1.2", optional = true }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
oclive_kernel_contracts = { path = "../../kernel/crates/oclive_kernel_contracts" }

[target.'cfg(loom)'.dev-dependencies]
loom = { version = "0.7", features = ["checkpoint"] }

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
