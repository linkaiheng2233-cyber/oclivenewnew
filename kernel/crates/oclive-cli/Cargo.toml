[package]
name = "oclive-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Official oclive kernel project scaffolding CLI"
readme = "README.md"
repository = "https://github.com/linkaiheng2233-cyber/oclivenewnew"
keywords = ["oclive", "cli", "scaffold", "monolith", "kernel"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[[bin]]
name = "oclive-cli"
path = "src/main.rs"

[features]
default = []
diagnostics-host = ["oclive_kernel_host"]

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dialoguer = "0.12"
handlebars = "5.1"
notify = { workspace = true }
oclive_validation = { path = "../oclive_validation" }
oclive_kernel_runtime = { path = "../oclive_kernel_runtime" }
oclive_kernel_types = { path = "../oclive_kernel_types" }
oclive_kernel_host = { path = "../oclive_kernel_host", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, default-features = false, features = ["env-filter", "fmt", "std"] }
sysinfo = "0.39"
fs2 = "0.4"
reqwest = { workspace = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { workspace = true, features = ["deflate"] }
serde_yaml_ng = { workspace = true }
tar = "0.4"
flate2 = "1"
tempfile = { workspace = true }
uuid = { workspace = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
ctrlc = "3.4"

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
