[package]
name = "oclive_kernel_server"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Headless oclive kernel HTTP server (no Tauri window)"
repository = "https://github.com/linkaiheng2233-cyber/oclivenewnew"
keywords = ["oclive", "kernel", "headless", "http"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[features]
default = []
# CP-INT B9-B11 R1: forwards the default-off C3 receipt-window fault point to the linked Host crate.
# Must stay out of `default` so a normal `oclive-kernel-server` build carries no fault path.
test-faults = ["oclive_kernel_host/test-faults"]

[[bin]]
name = "oclive-kernel-server"
path = "src/main.rs"

[dependencies]
oclive_kernel_host = { path = "../oclive_kernel_host" }
oclive_kernel_runtime = { path = "../oclive_kernel_runtime" }
tracing = { workspace = true }
serde_json = { workspace = true }
