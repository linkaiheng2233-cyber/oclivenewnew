[package]
name = "oclive_kernel_host"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Headless OCLive kernel HTTP host (tracing + API server; no Tauri window)"
repository = "https://github.com/linkaiheng2233-cyber/oclivenewnew"
keywords = ["oclive", "kernel", "headless", "http"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[lib]
doctest = false

[features]
default = []
dual_core = []
tauri-commands = ["dep:tauri"]

[dependencies]
tauri = { version = "2", optional = true, default-features = false }
oclive_kernel_types = { path = "../oclive_kernel_types" }
oclive_kernel_contracts = { path = "../oclive_kernel_contracts" }
oclive_validation = { path = "../oclive_validation" }
oclive_kernel_runtime = { path = "../oclive_kernel_runtime" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync", "net", "signal"] }
arc-swap = { workspace = true }
sqlx = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
parking_lot = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "std", "json"] }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
dashmap = { workspace = true }
tracing-appender = { workspace = true }
once_cell = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
semver = { workspace = true }
notify = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
axum = { workspace = true, features = ["macros"] }
tower-http = { workspace = true, features = ["cors"] }
futures-util = "0.3"
tokio-stream = "0.1"
sha2 = { workspace = true }
indexmap = { workspace = true }
sysinfo = "0.39"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
