[package]
name = "oclive_validation"
version = "0.1.0"
edition = "2021"
description = "Shared role pack manifest validation (native + wasm for pack editor)"
license = "Apache-2.0"
repository = "https://github.com/linkaiheng2233-cyber/oclivenewnew"
keywords = ["oclive", "validation", "manifest", "role-pack"]
categories = ["development-tools"]

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
oclive_kernel_base = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
semver = { workspace = true }
wasm-bindgen = { version = "0.2", optional = true }
png = { version = "0.18.1", default-features = false, optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]
media-png = ["dep:png"]

[dev-dependencies]
tempfile = { workspace = true }
# Match Tauri's dom_query bit-set/bit-vec 0.8 until both support the newer family.
# This only constrains the property-test toolchain; production dependencies are unchanged.
proptest = "~1.11.0"
