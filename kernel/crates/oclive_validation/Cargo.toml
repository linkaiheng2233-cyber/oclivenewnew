[package]
name = "oclive_validation"
version = "0.1.0"
edition = "2021"
description = "Shared role pack manifest validation (native + wasm for pack editor)"
license = "Apache-2.0"
repository = "https://github.com/linkaiheng2233-cyber/oclivenewnew"
keywords = ["oclive", "validation", "manifest", "role-pack"]
categories = ["development-tools"]

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
semver = { workspace = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dev-dependencies]
tempfile = { workspace = true }
proptest = ">=1.4, <1.12"
