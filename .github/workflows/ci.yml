name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional comparison base for the impact plan
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  # Stage 3.1: safe draft PRs use the trusted plan for development feedback.
  # Ready docs-only PRs remain the promoted canary; every unsafe plan stays full.
  ci-impact-plan:
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.execution.outputs.run_full }}
      selected_jobs: ${{ steps.execution.outputs.selected_jobs }}
      mode: ${{ steps.execution.outputs.mode }}
      reason: ${{ steps.execution.outputs.reason }}
      trusted_sha: ${{ steps.comparison.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve comparison base
        id: comparison
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          MANUAL_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$MANUAL_BASE_SHA" ]; then
            if ! git cat-file -e "${MANUAL_BASE_SHA}^{commit}" 2>/dev/null; then
              echo "manual base_sha is not an available commit: $MANUAL_BASE_SHA" >&2
              exit 1
            fi
            base="$(git rev-parse "$MANUAL_BASE_SHA")"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            base="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          else
            base="$(git rev-parse HEAD)"
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            policy="pull_request"
          else
            policy="merge"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "policy=$policy" >> "$GITHUB_OUTPUT"
      - name: Capture changed paths
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p target/oclive-ci
          git diff --name-only --diff-filter=ACMRD -z "$BASE_SHA" "$HEAD_SHA" -- \
            > target/oclive-ci/changed-files.zlist
      - name: Checkout trusted CI control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.comparison.outputs.base }}
          path: target/oclive-ci/trusted
          fetch-depth: 1
      - name: Compute impact plan
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base }}
          HEAD_SHA: ${{ github.sha }}
          PLAN_POLICY: ${{ steps.comparison.outputs.policy }}
        run: |
          set -euo pipefail
          TRUSTED_ROOT="$GITHUB_WORKSPACE/target/oclive-ci/trusted"
          cargo run --locked --manifest-path "$TRUSTED_ROOT/Cargo.toml" -p oclive-cli -- ci plan \
            --path "$TRUSTED_ROOT" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --policy "$PLAN_POLICY" \
            --changed-files-from "$GITHUB_WORKSPACE/target/oclive-ci/changed-files.zlist" \
            --output "$GITHUB_WORKSPACE/target/oclive-ci/plan.json"
      - name: Render impact summary
        run: |
          TRUSTED_ROOT="$GITHUB_WORKSPACE/target/oclive-ci/trusted"
          cargo run --locked --manifest-path "$TRUSTED_ROOT/Cargo.toml" -p oclive-cli -- ci explain \
            --path "$TRUSTED_ROOT" \
            --plan "$GITHUB_WORKSPACE/target/oclive-ci/plan.json" \
            --format markdown \
            --output "$GITHUB_WORKSPACE/target/oclive-ci/summary.md"
          cat target/oclive-ci/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve execution policy
        id: execution
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft || false }}
        run: |
          set -euo pipefail
          POLICY_SCRIPT="$GITHUB_WORKSPACE/target/oclive-ci/trusted/scripts/ci-execution-policy.mjs"
          POLICY_ARGS=()
          if [ ! -f "$POLICY_SCRIPT" ]; then
            echo "Trusted base predates the execution policy; bootstrap stays full."
            POLICY_SCRIPT="$GITHUB_WORKSPACE/scripts/ci-execution-policy.mjs"
            POLICY_ARGS=(--force-full-reason trusted_policy_bootstrap)
          fi
          node "$POLICY_SCRIPT" resolve \
            --plan target/oclive-ci/plan.json \
            --event "$EVENT_NAME" \
            --output target/oclive-ci/execution.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --pr-draft "$PR_DRAFT" \
            "${POLICY_ARGS[@]}"
      - name: Upload impact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oclive-ci-impact-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/oclive-ci/plan.json
            target/oclive-ci/summary.md
            target/oclive-ci/execution.json
            target/oclive-ci/changed-files.zlist
          if-no-files-found: warn
          retention-days: 90

  rust:
    needs: ci-impact-plan
    if: ${{ always() && (needs.ci-impact-plan.result != 'success' || needs.ci-impact-plan.outputs.run_full == 'true' || contains(needs.ci-impact-plan.outputs.selected_jobs, '"rust"')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Build frontend (Tauri generate_context)
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies (Tauri 2 / webkit2gtk-4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential curl wget \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Bundle kernel server for Tauri resources
        run: node scripts/bundle-kernel-for-tauri.mjs --profile debug
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (workspace)
        run: cargo clippy --locked --workspace --exclude oclive-cli --all-targets --all-features -- -D warnings
      - name: tests (workspace)
        env:
          CARGO_BUILD_JOBS: "1"
        run: cargo test --locked --workspace --exclude oclive-cli

  layering-ratchet:
    needs: ci-impact-plan
    if: ${{ always() && (needs.ci-impact-plan.result != 'success' || needs.ci-impact-plan.outputs.run_full == 'true' || contains(needs.ci-impact-plan.outputs.selected_jobs, '"layering-ratchet"')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: domain→infrastructure import ratchet
        run: node scripts/check-domain-layering.mjs

  dimension5-acceptance:
    needs: ci-impact-plan
    if: ${{ always() && (needs.ci-impact-plan.result != 'success' || needs.ci-impact-plan.outputs.run_full == 'true' || contains(needs.ci-impact-plan.outputs.selected_jobs, '"dimension5-acceptance"')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Fetch cargo advisory-db
        run: |
          mkdir -p "$HOME/.cargo"
          git clone --depth 1 https://github.com/RustSec/advisory-db.git "$HOME/.cargo/advisory-db"
      - name: Dimension 5 acceptance gate (--ci)
        run: node scripts/dimension5-acceptance.mjs --ci

  npm-audit:
    needs: ci-impact-plan
    if: ${{ always() && (needs.ci-impact-plan.result != 'success' || needs.ci-impact-plan.outputs.run_full == 'true' || contains(needs.ci-impact-plan.outputs.selected_jobs, '"npm-audit"')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: npm audit (production and development dependency gates)
        run: npm run audit:dependencies

  plugins-index:
    needs: ci-impact-plan
    if: ${{ always() && (needs.ci-impact-plan.result != 'success' || needs.ci-impact-plan.outputs.run_full == 'true' || contains(needs.ci-impact-plan.outputs.selected_jobs, '"plugins-index"')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Validate data/plugins.json
        run: node scripts/validate-plugins-index.mjs

  stale-paths:
    needs: ci-impact-plan
    if: ${{ always() && (needs.ci-impact-plan.result != 'success' || needs.ci-impact-plan.outputs.run_full == 'true' || contains(needs.ci-impact-plan.outputs.selected_jobs, '"stale-paths"')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Legacy doc paths / banned aliases (hard gate)
        run: node scripts/check-stale-paths.mjs

  kernel-host-dual-core:
    needs: ci-impact-plan
    if: ${{ always() && (needs.ci-impact-plan.result != 'success' || needs.ci-impact-plan.outputs.run_full == 'true' || contains(needs.ci-impact-plan.outputs.selected_jobs, '"kernel-host-dual-core"')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test oclive_kernel_host with dual_core feature
        run: cargo test --locked -p oclive_kernel_host --features dual_core

  cli:
    needs: ci-impact-plan
    if: ${{ always() && (needs.ci-impact-plan.result != 'success' || needs.ci-impact-plan.outputs.run_full == 'true' || contains(needs.ci-impact-plan.outputs.selected_jobs, '"cli"')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: clippy oclive-cli
        run: cargo clippy --locked -p oclive-cli --all-targets -- -D warnings
      - name: test oclive-cli
        # CLI E2E tests spawn nested Cargo builds. Serial test execution avoids package-cache
        # lock contention; the full crate run already includes kernel_ensure_plan_snapshot.
        run: cargo test --locked -p oclive-cli -- --test-threads=1

  # ARM64 Linux cross-compile smoke (no tests on target; catches arch-specific breakages)
  rust-arm64-cross:
    needs: ci-impact-plan
    if: ${{ always() && (needs.ci-impact-plan.result != 'success' || needs.ci-impact-plan.outputs.run_full == 'true' || contains(needs.ci-impact-plan.outputs.selected_jobs, '"rust-arm64-cross"')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Add aarch64-unknown-linux-gnu
        run: rustup target add aarch64-unknown-linux-gnu
      - name: Install cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: cargo check (aarch64 kernel crates)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo check --locked -p oclive_kernel_server -p oclive_kernel_host -p oclive_kernel_runtime --target aarch64-unknown-linux-gnu

  frontend:
    needs: ci-impact-plan
    if: ${{ always() && (needs.ci-impact-plan.result != 'success' || needs.ci-impact-plan.outputs.run_full == 'true' || contains(needs.ci-impact-plan.outputs.selected_jobs, '"frontend"')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:theater:smoke
      - run: npm run build:e2e
      - name: Install Playwright Chromium (Linux only)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_DISABLE_HEADLESS_SHELL: "1"
      - name: Preview shell E2E — A1.1b (Linux only)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export OCLIVE_PREVIEW_PORT="${OCLIVE_PREVIEW_PORT:-4180}"
          node ./node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port "${OCLIVE_PREVIEW_PORT}" --strictPort > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
          for _ in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:${OCLIVE_PREVIEW_PORT}/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf "http://127.0.0.1:${OCLIVE_PREVIEW_PORT}/" >/dev/null || (echo "--- vite preview log ---"; cat /tmp/vite-preview.log; exit 1)
          export PW_TEST_USE_EXTERNAL=1
          export CI=true
          npm run test:e2e:preview
        env:
          PLAYWRIGHT_DISABLE_HEADLESS_SHELL: "1"
      - name: Stop vite preview (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          if [ -f /tmp/vite-preview.pid ]; then
            kill "$(cat /tmp/vite-preview.pid)" || true
          fi

  cross-host-e2e:
    needs: ci-impact-plan
    if: ${{ always() && (needs.ci-impact-plan.result != 'success' || needs.ci-impact-plan.outputs.run_full == 'true' || contains(needs.ci-impact-plan.outputs.selected_jobs, '"cross-host-e2e"')) }}
    runs-on: ubuntu-22.04
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Build oclive-kernel-server and oclive-cli
        run: cargo build --locked -p oclive_kernel_server -p oclive-cli
      - name: Cross-host memory + distro kernel + profile smoke
        run: |
          set -euo pipefail
          TARGET="$(python - <<'PY'
          import json, os, subprocess
          root = os.environ["GITHUB_WORKSPACE"]
          out = subprocess.check_output(
              ["cargo", "metadata", "--format-version=1", "--no-deps"],
              cwd=root,
          )
          print(json.loads(out)["target_directory"])
          PY
          )"
          export OCLIVE_E2E_KERNEL="$TARGET/debug/oclive-kernel-server"
          export OCLIVE_E2E_CLI="$TARGET/debug/oclive-cli"
          test -x "$OCLIVE_E2E_KERNEL"
          test -x "$OCLIVE_E2E_CLI"
          node scripts/e2e-cross-host-memory.mjs
          node scripts/e2e-distro-kernel.mjs --scenario all
          node scripts/e2e-kernel-profile.mjs
          node scripts/e2e-tauri-bundled-kernel.mjs
          node scripts/diff-vscode-distro-profile.mjs

  oocp-test-suite:
    needs: ci-impact-plan
    if: ${{ always() && (needs.ci-impact-plan.result != 'success' || needs.ci-impact-plan.outputs.run_full == 'true' || contains(needs.ci-impact-plan.outputs.selected_jobs, '"oocp-test-suite"')) }}
    runs-on: ubuntu-22.04
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Install Linux dependencies (Tauri 2 / webkit2gtk-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential curl wget \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build frontend (Tauri generate_context)
        run: npm ci && npm run build
      - name: Bundle kernel server for Tauri resources
        run: node scripts/bundle-kernel-for-tauri.mjs --profile debug
      - name: Build oclivenewnew-tauri (--api + dual_core)
        working-directory: distros/desktop-tauri
        run: cargo build --locked -p oclivenewnew-tauri --features dual_core
      - name: Start HTTP API and run OOCP suite (S0–S12 + optional S13/S14)
        run: |
          set -euo pipefail
          export OCLIVE_ROLES_DIR="$GITHUB_WORKSPACE/distros/chat-pro/roles"
          export OCLIVE_HTTP_API_MOCK_LLM=1
          export OCLIVE_API_TOKEN="oclive-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export OCLIVE_SKIP_HIGH_RISK_GRANTS=1
          TARGET="$(python - <<'PY'
          import json, os, subprocess
          root = os.environ["GITHUB_WORKSPACE"]
          out = subprocess.check_output(
              ["cargo", "metadata", "--format-version=1", "--no-deps"],
              cwd=os.path.join(root, "distros", "desktop-tauri"),
          )
          print(json.loads(out)["target_directory"])
          PY
          )"
          PORT=9842
          "$TARGET/debug/oclivenewnew-tauri" --api --port "$PORT" > /tmp/oocp_api.log 2>&1 &
          echo $! > /tmp/oocp_api.pid
          for _ in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${PORT}/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf "http://127.0.0.1:${PORT}/health" >/dev/null || (echo "--- oclive api log ---"; cat /tmp/oocp_api.log; exit 1)
          export OCLIVE_API_BASE="http://127.0.0.1:${PORT}"
          export OCLIVE_OOCP_ROLE_PATH="$GITHUB_WORKSPACE/distros/chat-pro/roles/mumu"
          export OCLIVE_OOCP_INCLUDE_DUAL_CORE=1
          cd "$GITHUB_WORKSPACE/examples/oocp-test-suite"
          node run.mjs --include-dual-core
          export OCLIVE_E2E_BINARY="$TARGET/debug/oclivenewnew-tauri"
          export OCLIVE_E2E_PORT=9843
          node "$GITHUB_WORKSPACE/scripts/e2e-core-api-restart.mjs"
      - name: Stop HTTP API
        if: always()
        run: |
          if [ -f /tmp/oocp_api.pid ]; then
            kill "$(cat /tmp/oocp_api.pid)" || true
          fi

  remote-plugin-demo:
    needs: ci-impact-plan
    if: ${{ always() && (needs.ci-impact-plan.result != 'success' || needs.ci-impact-plan.outputs.run_full == 'true' || contains(needs.ci-impact-plan.outputs.selected_jobs, '"remote-plugin-demo"')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Start minimal remote plugin demo
        run: |
          python examples/remote_plugin_minimal/server.py > /tmp/remote_plugin_demo.log 2>&1 &
          echo $! > /tmp/remote_plugin_demo.pid
          for _ in $(seq 1 30); do
            if curl -sf -X POST http://127.0.0.1:8765/rpc \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":0,"method":"memory.rank","params":{"memories":[],"user_query":"ping","limit":1}}' \
              >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          curl -sf -X POST http://127.0.0.1:8765/rpc \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":0,"method":"memory.rank","params":{"memories":[],"user_query":"ping","limit":1}}' \
            >/dev/null || (echo "--- remote plugin demo log ---"; cat /tmp/remote_plugin_demo.log; exit 1)
      - name: Smoke test memory.rank JSON-RPC
        run: |
          python - <<'PY'
          import json
          from urllib import request

          body = json.dumps({
              "jsonrpc": "2.0",
              "id": 1,
              "method": "memory.rank",
              "params": {
                  "memories": [{"id": "m1"}, {"id": "m2"}],
                  "user_query": "hello",
                  "scene_id": "default",
                  "limit": 1
              }
          }).encode("utf-8")

          req = request.Request(
              "http://127.0.0.1:8765/rpc",
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with request.urlopen(req, timeout=5) as resp:
              raw = resp.read().decode("utf-8")
          data = json.loads(raw)
          assert data["jsonrpc"] == "2.0", raw
          assert data["id"] == 1, raw
          ids = data["result"]["ordered_ids"]
          assert ids == ["m1"], raw
          print("remote-plugin-demo smoke ok")
          PY
      - name: Stop demo server
        if: always()
        run: |
          if [ -f /tmp/remote_plugin_demo.pid ]; then
            kill "$(cat /tmp/remote_plugin_demo.pid)" || true
          fi

  ci-gate:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'ci-draft-gate' || 'ci-gate' }}
    if: ${{ always() }}
    needs:
      - ci-impact-plan
      - rust
      - layering-ratchet
      - dimension5-acceptance
      - npm-audit
      - plugins-index
      - stale-paths
      - kernel-host-dual-core
      - cli
      - rust-arm64-cross
      - frontend
      - cross-host-e2e
      - oocp-test-suite
      - remote-plugin-demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout trusted CI control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.ci-impact-plan.outputs.trusted_sha }}
          path: target/oclive-ci/trusted
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Download impact evidence
        if: ${{ always() && needs.ci-impact-plan.result == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: oclive-ci-impact-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/oclive-ci/impact
      - name: Verify selected CI responsibilities
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          POLICY_SCRIPT="$GITHUB_WORKSPACE/target/oclive-ci/trusted/scripts/ci-execution-policy.mjs"
          if [ ! -f "$POLICY_SCRIPT" ]; then
            POLICY_SCRIPT="$GITHUB_WORKSPACE/scripts/ci-execution-policy.mjs"
          fi
          node "$POLICY_SCRIPT" verify --needs-env NEEDS_JSON
      - name: Snapshot terminal workflow jobs
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/oclive-ci/compare
          for attempt in 1 2 3; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" \
              > target/oclive-ci/compare/jobs.json.tmp; then
              mv target/oclive-ci/compare/jobs.json.tmp target/oclive-ci/compare/jobs.json
              exit 0
            fi
            sleep $((attempt * 2))
          done
          rm -f target/oclive-ci/compare/jobs.json.tmp
          echo "::warning::Remote job snapshot was unavailable; Compare evidence will remain observational."
      - name: Collect same-SHA Compare evidence
        if: ${{ always() && needs.ci-impact-plan.result == 'success' }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          COLLECTOR="$GITHUB_WORKSPACE/target/oclive-ci/trusted/scripts/collect-ci-compare-evidence.mjs"
          if [ ! -f "$COLLECTOR" ]; then
            COLLECTOR="$GITHUB_WORKSPACE/scripts/collect-ci-compare-evidence.mjs"
          fi
          PR_ARGS=()
          if [ -n "$PR_NUMBER" ]; then
            PR_ARGS=(--pull-request "$PR_NUMBER")
          fi
          node "$COLLECTOR" collect \
            --plan target/oclive-ci/impact/plan.json \
            --execution target/oclive-ci/impact/execution.json \
            --jobs target/oclive-ci/compare/jobs.json \
            --needs-env NEEDS_JSON \
            --repository "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --ref "$GITHUB_REF" \
            --workflow-sha "$GITHUB_SHA" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --output target/oclive-ci/compare/compare.evidence.json \
            --summary-output target/oclive-ci/compare/compare.summary.md \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            "${PR_ARGS[@]}"
      - name: Upload Compare evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: oclive-ci-compare-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/oclive-ci/compare/
          if-no-files-found: warn
          retention-days: 90
