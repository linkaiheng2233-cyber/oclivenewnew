name: Tauri build (optional)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: tauri-build-optional-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tauri-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Linux dependencies (Tauri / WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libsoup2.4-dev
      - name: pkg-config shims (Noble WebKit 4.1 only; Tauri 1 probes gtk 4.0 .pc)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          m="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          pc="/usr/lib/${m}/pkgconfig"
          sudo ln -sf "${pc}/javascriptcoregtk-4.1.pc" "${pc}/javascriptcoregtk-4.0.pc"
          sudo ln -sf "${pc}/webkit2gtk-4.1.pc" "${pc}/webkit2gtk-4.0.pc"
      - run: npm ci
      - run: npm run build
      - name: Tauri build
        env:
          CI: "true"
        run: npm run tauri build
