name: Cargo Audit (lockfile)

on:
  pull_request:
    paths:
      - Cargo.lock
      - .cargo/audit.toml

permissions:
  contents: read

jobs:
  audit-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (explicit stable)
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: cargo audit (fail on vulnerability)
        run: cargo audit
