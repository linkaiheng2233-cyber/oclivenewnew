name: CI targeted rerun

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed CI run ID to inspect and rerun once
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  rerun-flaky:
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed rust matrix once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Refuse rerun: run_id must be numeric"
            exit 1
          fi
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          WORKFLOW_NAME="$(jq -r '.name' <<< "$RUN_JSON")"
          CONCLUSION="$(jq -r '.conclusion' <<< "$RUN_JSON")"
          ATTEMPT="$(jq -r '.run_attempt' <<< "$RUN_JSON")"
          if [ "$WORKFLOW_NAME" != "CI" ]; then
            echo "Refuse rerun: run $RUN_ID belongs to workflow $WORKFLOW_NAME"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "Refuse rerun: run $RUN_ID conclusion is $CONCLUSION"
            exit 1
          fi
          if [ "$ATTEMPT" -gt 1 ]; then
            echo "Skip rerun: workflow already retried (attempt=$ATTEMPT)"
            exit 0
          fi
          FAILED=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.conclusion=="failure") | .name')
          if [ -z "$FAILED" ]; then
            echo "Skip rerun: no failed jobs found"
            exit 0
          fi
          unexpected=""
          rm -f /tmp/oclive-ci-rust-failure.txt /tmp/oclive-ci-unexpected-failures.txt
          echo "$FAILED" | while read -r job; do
            case "$job" in
              rust\ \(*\))
                echo "Allowlisted rust matrix failure: $job"
                touch /tmp/oclive-ci-rust-failure.txt
                ;;
              ci-gate)
                echo "Expected aggregate failure while an allowlisted rust job is red: $job"
                ;;
              *)
                echo "$job" >> /tmp/oclive-ci-unexpected-failures.txt
                ;;
            esac
          done
          if [ -f /tmp/oclive-ci-unexpected-failures.txt ]; then
            unexpected="$(cat /tmp/oclive-ci-unexpected-failures.txt)"
          fi
          if [ ! -f /tmp/oclive-ci-rust-failure.txt ]; then
            echo "Skip rerun: ci-gate alone is not an allowlisted flake"
            exit 0
          fi
          if [ -n "$unexpected" ]; then
            echo "Skip rerun: deterministic or non-allowlisted failures must be investigated"
            echo "$unexpected"
            exit 0
          fi
          echo "Rerunning failed rust matrix jobs for run $RUN_ID"
          gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" --failed
