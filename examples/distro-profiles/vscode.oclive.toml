# OCLive VS Code Flash — Pro 简洁版（explicit six-slot matrix）
# Install copy: <extension-root>/distro.oclive.toml · SSOT mirror of this file
# See creator-docs/kernel/DISTRO_DEFAULT_PLUGINS.md §3.2
# See creator-docs/kernel/DISTRO_CAPABILITY_PROFILE.md

schema_version = 1
distro_id = "vscode"
display_name = "OCLive VS Code Flash"

[interaction]
default_mode = "pure_chat"
allow_mode_switch = false

[host_flags]
skip_agent = true
skip_complex_emotion = true
event_impact_llm = false

[slots]
complex_emotion = "off"

[prompt]
profile = "concise"

[state_expression]
favor_high = "更信任用户的技术判断，少寒暄"
favor_mid  = "保持友好但不越界"
favor_low  = "保持距离与礼貌"

[memory]
retrieval = "light"

[post_process]
chain = "standard"

[turn_thinking]
default = "auto"
fast_skip_complex_emotion = true
auto_deep_min_chars = 80
fast_knowledge_limit = 4
fast_memory_cap = 4
fast_persistence = "strong_only"
prompt_prefix_cache = true

[user_identity]
default_id = "classmate"

[plugin_backends]
memory = "builtin"
emotion = "builtin"
event = "builtin"
prompt = "builtin"
llm = "ollama"
