# OCLive VS Code extension — capability profile (example)
# Install copy: <extension-root>/distro.oclive.toml
# SSOT mirror: oclivenewnew/examples/distro-profiles/vscode.oclive.toml
# See creator-docs/kernel/DISTRO_CAPABILITY_PROFILE.md

schema_version = 1
distro_id = "vscode"
display_name = "OCLive VS Code"

[interaction]
default_mode = "pure_chat"
allow_mode_switch = true
immersive_unlock_hint_after_turns = 10

[host_flags]
skip_agent = true
skip_complex_emotion = true

[slots]
complex_emotion = "off"

[prompt]
profile = "concise"

[state_expression]
favor_high = "更信任用户的技术判断，少寒暄"
favor_mid  = "保持友好但不越界"
favor_low  = "保持距离与礼貌"

[memory]
# retrieval: reserved, not parsed in v0.3
retrieval = "light"

[post_process]
chain = "minimal"

# VS Code: default identity when session has no explicit choice (matches mumu catalog).
[user_identity]
default_id = "classmate"

[plugin_backends]
memory = "builtin"
emotion = "builtin"
event = "builtin"
prompt = "builtin"
llm = "ollama"
# agent ignored when skip_agent = true
