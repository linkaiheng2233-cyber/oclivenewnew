# A.I.Live Chat Pro — capability profile (聊天基础发行版 · Pro · open ceiling)
# Omit [plugin_backends]: role blueprints + directory plugins retain full six-slot surface.
# Copy beside install root or set OCLIVE_DISTRO_PROFILE to this path.
# Bundled mirror: src-tauri/resources/distro-profiles/desktop.oclive.toml
# See creator-docs/kernel/DISTRO_CAPABILITY_PROFILE.md · DISTRO_DEFAULT_PLUGINS.md §3.1

schema_version = 1
distro_id = "desktop"
display_name = "A.I.Live Chat Pro"

[interaction]
default_mode = "pure_chat"
allow_mode_switch = true
immersive_unlock_hint_after_turns = 10

[host_flags]
skip_agent = false
skip_complex_emotion = false

[slots]
complex_emotion = "on"

[prompt]
profile = "full"

[state_expression]
favor_high = "可更自然地分享日常与情绪，但仍遵守关系阶段"
favor_mid  = "保持温暖、有分寸的闲聊节奏"
favor_low  = "礼貌克制，勿过度主动"

[memory]
retrieval = "default"

[post_process]
chain = "standard"

[llm_runtime]
mode = "performance"
endpoint = "http://127.0.0.1:8421"
auto_start = true
startup_timeout_ms = 90000
retry_cooldown_ms = 30000
model_alias = "oclive-performance"
performance_profile = "gpu_balanced"

[resource_coordination]
gpu_safety_reserve_mib = 768
system_memory_safety_reserve_mib = 1024
cpu_safety_reserve_threads = 1
pending_lease_ttl_ms = 120000
active_lease_ttl_ms = 1800000
allow_unverified_admission = true
admission_queue_timeout_ms = 30000
queue_aging_quantum_ms = 2000
automatic_preemption = true

[turn_thinking]
default = "auto"
fast_skip_complex_emotion = true
auto_deep_min_chars = 80
fast_knowledge_limit = 4
fast_memory_cap = 4
fast_persistence = "strong_only"
prompt_prefix_cache = true
