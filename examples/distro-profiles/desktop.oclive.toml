# OCLive desktop distribution — capability profile (example)
# Copy beside install root or set OCLIVE_DISTRO_PROFILE to this path.
# See creator-docs/kernel/DISTRO_CAPABILITY_PROFILE.md

schema_version = 1
distro_id = "desktop"
display_name = "OCLive Desktop"

[host_flags]
skip_agent = false
skip_complex_emotion = false

[slots]
complex_emotion = "on"

[prompt]
profile = "full"

[memory]
retrieval = "default"

[post_process]
chain = "standard"

# Optional User Identity defaults (catalog still comes from role pack user_identities/).
# Desktop typically follows catalog default_identity_id; omit default_id unless tightening UX.
# [user_identity]
# default_id = "classmate"
# allowed_ids = ["classmate", "friend"]

# Desktop does not tighten plugin_backends here — full capability from role packs.
# Optional explicit defaults (same as engine defaults):
# [plugin_backends]
# memory = "builtin"
# emotion = "builtin"
# event = "builtin"
# prompt = "builtin"
# llm = "ollama"
# agent = "builtin"
